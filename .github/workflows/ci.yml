name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Minimum supported toolchain (go.mod) plus the current stable one.
        go-version: [1.25.x, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: Frontend asset measurements (raw and gzip)
        run: bash scripts/check-assets.sh
      - name: Bootstrap and candidate artifact fixtures
        run: bash scripts/test-bootstrap.sh
      - name: Credential-free synthetic backup helper fixtures
        run: python3 scripts/test-phase8.1-synthetic-backup.py
      - name: Test (race)
        run: go test -race ./...
      - name: Encrypted archive enforcement load (isolated Linux fixture)
        run: GOMAXPROCS=1 go test -race -tags integration ./internal/serve -run TestEncryptedBackupLoadPreservesEnforcementCadence -count=1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o wg-guard ./cmd/wg-guard

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: govulncheck (tool version pinned)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Build verified manager and canonical Docker runtime
        run: |
          bash scripts/build-artifacts.sh --version candidate --output "$RUNNER_TEMP/wg-guard-assets"
          python3 scripts/build-runtime-artifacts.py --assets "$RUNNER_TEMP/wg-guard-assets"
          (cd "$RUNNER_TEMP/wg-guard-assets" && sha256sum --check checksums.txt)
          bash scripts/test-runtime-image.sh "$RUNNER_TEMP/wg-guard-assets/runtime-metadata.json"
      - name: Keep unpublished offline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verified-runtime-candidate
          path: ${{ runner.temp }}/wg-guard-assets
          retention-days: 7
