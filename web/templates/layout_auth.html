{{define "auth"}}<!DOCTYPE html>
<html lang="{{.Locale}}" dir="{{.Dir}}"{{if ne .Theme "system"}} data-theme="{{.Theme}}"{{end}}>
<head>
{{template "document-head" .}}
<title>{{template "title" .}} · {{.T "app.name"}}</title>
<script type="module" src="{{.A "/js/app.js"}}"></script>
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="brand">
      <span class="logo">{{.Icon "shield"}}</span>
      <span>{{.T "app.name"}}</span>
    </div>
    {{template "flash" .}}
    {{block "content" .}}{{end}}
    <div class="auth-foot">
      <span class="text-subtle text-xs">{{.T "app.tagline"}}</span>
      {{template "preferences" .}}
    </div>
  </div>
</div>
{{template "feedback-host" .}}
</body>
</html>{{end}}
