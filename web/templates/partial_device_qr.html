{{define "device_qr_dialog"}}
<script type="module" src="{{.A "/js/qr.js"}}"></script>
<dialog id="qr-modal" class="modal modal--qr" aria-labelledby="qr-dialog-title" data-qr-loading="{{.T "common.loading"}}" data-qr-error="{{.T "devices.qr_error"}}">
  <div class="modal-head">
    <h2 id="qr-dialog-title" data-qr-dialog-title data-single-title="{{.T "devices.qr"}}">{{.T "devices.qr"}}</h2>
    <button type="button" class="icon-btn" data-close-modal aria-label="{{.T "common.close"}}">{{.IconS "x"}}</button>
  </div>
  <div class="modal-body qr-body">
    <div data-qr-single>
      <p data-qr-state role="status" data-loading="{{.T "common.loading"}}" data-error="{{.T "devices.qr_error"}}"></p>
      <img id="qr-img" alt="{{.T "devices.qr"}}" width="280" height="280" hidden>
      <button type="button" class="btn" data-qr-retry hidden>{{.T "common.retry"}}</button>
      <p class="text-muted text-sm">{{.T "devices.config_note"}}</p>
    </div>
    <div class="qr-all-panel" data-qr-all-panel hidden>
      <p class="section-description">{{.T "devices.qr_all_hint"}}</p>
      <div class="qr-all-grid" data-qr-all-grid></div>
    </div>
  </div>
</dialog>
{{end}}
