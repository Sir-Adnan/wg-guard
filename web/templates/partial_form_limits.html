{{define "preset_chips"}}
{{$v := .v}}
<div class="chips chips-row" role="group" aria-label="{{$v.T "users.form.presets"}}">
  {{range .quota}}<button type="button" class="chip-btn" data-fill-value="{{.}}" data-fill-unit="gb"><bdi class="ltr-data">{{.}} GB</bdi></button>{{end}}
  {{range .months}}<button type="button" class="chip-btn" data-fill-value="{{.}}" data-fill-unit="months"><bdi class="ltr-data">{{.}}</bdi> {{$v.T "duration.months_short"}}</button>{{end}}
</div>
{{end}}
