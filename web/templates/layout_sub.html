{{define "sub"}}<!DOCTYPE html>
<html lang="{{.Locale}}" dir="{{.Dir}}"{{if ne .Theme "system"}} data-theme="{{.Theme}}"{{end}}>
<head>
{{template "document-head" .}}
<meta name="robots" content="noindex, nofollow">
<title>{{.T "sub.title"}} · {{.T "app.name"}}</title>
</head>
<body class="sub-body">
<main class="sub-shell">
{{block "subcontent" .}}{{end}}
<footer class="sub-foot">
  <span>{{.T "app.name"}}</span>
  <span class="spacer"></span>
  {{template "public-preferences" .}}
</footer>
</main>
{{template "feedback-host" .}}
</body>
</html>{{end}}
