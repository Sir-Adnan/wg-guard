{{define "confirm-dialog"}}
<dialog id="confirm-dialog" class="dialog dialog--sm dialog--danger" aria-labelledby="confirm-title" aria-describedby="confirm-message">
  <div class="dialog-header">
    <span class="dialog-icon" aria-hidden="true">{{.Icon "alert-triangle"}}</span>
    <div class="dialog-heading">
      <h2 class="dialog-title" id="confirm-title" data-confirm-title>{{.T "common.confirm_delete"}}</h2>
      <p class="dialog-description" id="confirm-message" data-confirm-message></p>
    </div>
  </div>
  <div class="dialog-footer">
    <button type="button" class="btn" data-close-modal>{{.T "common.cancel"}}</button>
    <button type="button" class="btn btn--destructive" data-confirm-ok>{{.T "common.confirm"}}</button>
  </div>
</dialog>
{{end}}
